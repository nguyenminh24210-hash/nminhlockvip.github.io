<!DOCTYPE html>
<html>
<head>
  <title>Key Manager</title>
  <style>
    body { background: #0d0d0d; color: #e0e0e0; font-family: monospace; padding: 20px; }
    input, select { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px; margin: 4px; border-radius: 4px; }
    button { background: #222; border: 1px solid #555; color: #0f0; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
    button:hover { background: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: left; font-size: 12px; }
    th { background: #1a1a1a; }
    .expired { color: #f44; }
    .valid { color: #0f0; }
  </style>
</head>
<body>
  <h2>🔑 KEY SERVER PANEL</h2>

  <div>
    <input id="adminToken" type="password" placeholder="Admin Token" />
    <input id="apiBase" placeholder="Firebase Function URL" value="https://YOUR-PROJECT.cloudfunctions.net" />
  </div>

  <hr/>
  <h3>Tạo Key</h3>
  <input id="customKey" placeholder="Custom key (để trống = auto)" />
  <input id="days" type="number" placeholder="Số ngày" value="30" />
  <input id="note" placeholder="Ghi chú (user)" />
  <button onclick="createKey()">TẠO KEY</button>

  <hr/>
  <button onclick="listKeys()">🔄 Load danh sách key</button>
  <table id="keyTable">
    <thead><tr><th>KEY</th><th>Valid</th><th>Expires</th><th>Note</th><th>Action</th></tr></thead>
    <tbody id="keyBody"></tbody>
  </table>

  <script>
    function getBase() {
      return document.getElementById("apiBase").value;
    }
    function getToken() {
      return document.getElementById("adminToken").value;
    }

    async function createKey() {
      const body = {
        action: "create",
        key: document.getElementById("customKey").value || undefined,
        days: parseInt(document.getElementById("days").value),
        note: document.getElementById("note").value
      };
      const r = await fetch(getBase() + "/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-token": getToken() },
        body: JSON.stringify(body)
      });
      const d = await r.json();
      alert(d.success ? "Key: " + d.key : "Error: " + d.error);
      listKeys();
    }

    async function deleteKey(key) {
      if (!confirm("Xóa key: " + key + "?")) return;
      await fetch(getBase() + "/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-token": getToken() },
        body: JSON.stringify({ action: "delete", key })
      });
      listKeys();
    }

    async function listKeys() {
      const r = await fetch(getBase() + "/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-token": getToken() },
        body: JSON.stringify({ action: "list" })
      });
      const d = await r.json();
      const tbody = document.getElementById("keyBody");
      tbody.innerHTML = "";
      const now = Math.floor(Date.now() / 1000);
      for (const [k, v] of Object.entries(d.keys || {})) {
        const expired = v.expires_at < now;
        const exp = new Date(v.expires_at * 1000).toLocaleDateString("vi-VN");
        tbody.innerHTML += `<tr>
          <td>${k}</td>
          <td class="${v.valid && !expired ? 'valid' : 'expired'}">${v.valid && !expired ? "✓" : "✗"}</td>
          <td class="${expired ? 'expired' : ''}">${exp}</td>
          <td>${v.note || "-"}</td>
          <td><button onclick="deleteKey('${k}')">XÓA</button></td>
        </tr>`;
      }
    }
  </script>
</body>
</html>
